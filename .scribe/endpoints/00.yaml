name: Payments
description: ''
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: 'api/v1/webhooks/payment/{gateway}'
    metadata:
      custom: []
      groupName: Payments
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: 'Handle Payment Webhook'
      description: |-
        Receive and process payment gateway webhooks.
        This endpoint validates the webhook payload, updates the transaction,
        marks the order as paid, activates seller earnings, and generates an invoice.

        ⚠️ This endpoint is intended to be called **only by payment gateways**.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer Bearer {YOUR_API_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      gateway:
        custom: []
        name: gateway
        description: 'Payment gateway code.'
        required: true
        example: stripe
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanUrlParameters:
      gateway: stripe
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      type:
        custom: []
        name: type
        description: 'Webhook event type (Stripe).'
        required: false
        example: payment_intent.succeeded
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      data:
        custom: []
        name: data
        description: 'Webhook payload data.'
        required: false
        example: []
        type: object
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      data.object:
        custom: []
        name: data.object
        description: 'Payment object.'
        required: false
        example: []
        type: object
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      data.object.metadata.trx:
        custom: []
        name: data.object.metadata.trx
        description: 'Transaction reference.'
        required: false
        example: trx_65af8d2c1
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      type: payment_intent.succeeded
      data:
        object: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: |-
          {
            "success": true,
            "message": "Payment processed successfully"
          }
        headers: []
        description: ''
      -
        custom: []
        status: 200
        content: |-
          {
            "message": "Already processed"
          }
        headers: []
        description: ''
      -
        custom: []
        status: 400
        content: |-
          {
            "message": "Invalid webhook"
          }
        headers: []
        description: ''
      -
        custom: []
        status: 404
        content: |-
          {
            "message": "Payment method disabled"
          }
        headers: []
        description: ''
      -
        custom: []
        status: 404
        content: |-
          {
            "success": false,
            "message": "Transaction not found"
          }
        headers: []
        description: ''
      -
        custom: []
        status: 500
        content: |-
          {
            "success": false,
            "message": "Webhook error"
          }
        headers: []
        description: ''
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer your_real_test_token_here'
    controller: null
    method: null
    route: null
