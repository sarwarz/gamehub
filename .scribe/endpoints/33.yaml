        content: '{"status":true,"message":"Bootstrap data fetched successfully","data":{"settings":{"general":{"site_name":"GameHub","per_page":12},"captcha":{"provider":"none","site_key":null}},"currencies":[],"default_currency":{"code":"USD","symbol":"$"},"wallet":{"enabled":true,"deposit_enabled":true}}}'
        headers: []
        description: Success
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
