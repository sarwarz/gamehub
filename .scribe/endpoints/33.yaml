name: Settings
description: |-

  Public platform configuration endpoints.
  These endpoints expose non-sensitive settings that frontend/mobile apps
  need to render the storefront correctly.
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: api/v1/settings
    metadata:
      custom: []
      groupName: Settings
      groupDescription: |-

        Public platform configuration endpoints.
        These endpoints expose non-sensitive settings that frontend/mobile apps
        need to render the storefront correctly.
      subgroup: ''
      subgroupDescription: ''
      title: 'Get all public settings'
      description: |-
        Returns all publicly safe platform settings grouped by category.
        Sensitive settings (SMTP credentials, secret keys, admin emails, etc.) are excluded.
        All values are properly typed (booleans, integers, floats).
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"status":true,"message":"Settings fetched successfully","data":{"general":{"site_name":"GameHub","per_page":12},"store":{"min_order_amount":0.0,"tax_enabled":true},"captcha":{"provider":"none","site_key":null},"currencies":[{"code":"USD","name":"US Dollar","symbol":"$","rate":"1.00000000","is_default":true}]}}'
        headers: []
        description: Success
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
  -
